<!--
  Yurucommu brand mark. Mirrors yurucommu/public/icons/yurucommu.svg, but the
  "ゆ" is outlined geometry rather than an SVG <text> element: text marks do not
  rasterize in headless renderers (`tauri icon` and ImageMagick both silently
  drop the glyph and emit an empty tile), which is how the app icon previously
  shipped blank. Outline traced from Droid Sans Fallback (Apache-2.0), the
  predecessor of the Noto Sans JP family the web mark asks for; the stroke
  thickens the regular weight toward the web mark's font-weight 800.
-->
