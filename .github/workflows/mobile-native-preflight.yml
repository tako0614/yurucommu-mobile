name: Mobile Native Preflight

on:
  schedule:
    - cron: "29 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yurucommu-mobile-preflight-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  MOBILE_KIT_SOURCE_REF: 24036b32892d659f846e00a29849f0884ed4691a
  YURUCOMMU_CORE_SOURCE_REF: 6e496f525e382fbfdb6e0752295caf2aca9d6f77

jobs:
  repository-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          path: yurucommu-mobile
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tako0614/mobile-kit
          ref: ${{ env.MOBILE_KIT_SOURCE_REF }}
          path: mobile-kit
          persist-credentials: false

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: tako0614/yurucommu-core
          ref: ${{ env.YURUCOMMU_CORE_SOURCE_REF }}
          path: yurucommu-core
          persist-credentials: false

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
        working-directory: yurucommu-mobile

      - name: Run the mobile source gates
        run: bun run mobile:check
        working-directory: yurucommu-mobile

      - name: Fail repository-owned release blockers
        run: bun run release:repo-check
        working-directory: yurucommu-mobile

  rust-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install the pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit the native dependency lock
        run: cargo audit --file src-tauri/Cargo.lock
